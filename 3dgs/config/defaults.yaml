# Default configuration for 3DGS pipeline
# All quality-affecting parameters are listed here and exposed as CLI arguments

# =============================================================================
# Stage 1: Frame Quality Filtering (run_sharp.py)
# =============================================================================
# Controls which frames pass quality filtering before SHARP inference

frame_filter:
  max_angular_velocity_deg_per_sec: 120.0  # Reject frames with high motion (blur risk)
  max_exposure_duration_sec: 0.05          # Reject frames with long exposure (blur risk)
  max_upright_deviation_deg: 20.0          # Reject frames that aren't upright

# =============================================================================
# Stage 2: Merge & Alignment (merge_splats.py)
# =============================================================================
# Controls how per-frame splats are merged into the final PLY

merge:
  voxel_size_m: 0.05           # Voxel grid size for deduplication (smaller = more detail, larger file)
  depth_prune: true            # Enable depth-based pruning (removes splats that disagree with LiDAR)
  depth_threshold_m: 0.15      # Max depth disagreement in meters (only used if depth_prune is true)
  min_opacity_logit: -3.0      # Minimum opacity to keep (more negative = keep more transparent splats)
  max_scale_log: 2.0           # Maximum scale to keep (higher = keep larger splats)
